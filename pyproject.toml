[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cybora"
version = "0.1.0"
description = "Free modular defensive cybersecurity assessment platform."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Cybora Contributors" }
]
dependencies = [
    "typer>=0.20,<1.0",
    "rich>=13.9,<16.0",
    "httpx>=0.27,<1.0",
        "pydantic>=2.10,<3.0",
]

[project.scripts]
cybora = "cybora.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".pytest-temp", "pytest-temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]



